name: doctor

# Visibility, not enforcement.
#
# `cogos doctor --lint --severity-min <X>` was built as a CI gate (#573) and
# has never been invoked by any workflow — a purpose-built gate wired into
# nothing. This job closes that, but deliberately stops short of gating.
#
# Measured on a fresh `cogos init` workspace (2026-09-06, origin/main built
# with -tags fts5): 7 OK / 7 WARN / 0 FAIL / 5 UNKNOWN.
#   - `--severity-min warn` exits 1 on a clean tree, so gating at warn today
#     would red-light every PR.
#   - `--severity-min fail` exits 0. FAIL is genuinely empty on a healthy
#     scaffold, which makes it the honest gate threshold.
#
# The 5 UNKNOWNs are structural, not defects: a freshly-scaffolded workspace
# has no constellation.db until something indexes it, so the index/store
# checks correctly report "could not check" rather than OK. That is doctor's
# own contract ("UNKNOWN never reported as OK") behaving properly, and it is
# why this job must not treat UNKNOWN as failure.
#
# Several WARNs measured locally were HOST-derived (binary sprawl from a dev
# ~/.cog/bin, path references from a dev ~/.claude/settings.json). A clean
# runner should report fewer. That difference is itself worth watching, which
# is the point of running this on every PR before deciding any threshold.
#
# Promotion path: watch the summary across PRs; once the clean-runner WARN set
# is understood and driven to zero, flip `continue-on-error` off and raise
# --severity-min to warn.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    name: doctor (advisory)
    runs-on: ubuntu-latest
    # Advisory: this job reports, it never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # -tags fts5 matters: a bare `go build` links go-sqlite3 WITHOUT FTS5,
      # and doctor's index/store checks would then measure a degraded binary
      # rather than the one release ships. Same tag the Makefile and
      # release.yml use.
      - name: Build cogos (with fts5)
        shell: bash
        run: |
          set -euo pipefail
          go build -tags fts5 -o /tmp/cogos ./cmd/cogos
          # Verify the tag actually took, rather than trusting the build flag.
          # -tags fts5 without CGO yields a stub: the build succeeds, the
          # binary declares the tag, and doctor's index checks then silently
          # measure a degraded binary. Symbol presence is not module
          # availability, so count. Mirrors the identical assertion in
          # scripts/doctor-local.sh — the local runner had this guard and this
          # job did not, which is the sibling gap cog-review flagged.
          syms=$(strings /tmp/cogos | grep -c fts5 || true)
          echo "fts5 symbols: $syms (tagged build ~25, tagless ~1)"
          if [ "${syms:-0}" -lt 5 ]; then
            echo "::warning::only ${syms} fts5 symbols — doctor may be measuring a degraded binary (CGO_ENABLED?)"
          fi

      - name: Scaffold a fresh workspace
        run: |
          mkdir -p /tmp/ws
          /tmp/cogos init --workspace /tmp/ws

      # Advisory posture: exit 0 unless a check reports FAIL. Captured to a
      # file so the same run feeds both the log and the job summary.
      #
      # BOTH guards are required, and each covers a different failure:
      #
      #   set +e  — `shell: bash` expands to `bash --noprofile --norc -eo
      #     pipefail {0}`. Under `-e` + `pipefail`, a genuine FAIL makes the
      #     `doctor | tee` pipeline non-zero and the step ABORTS on that line —
      #     before advisory_exit is ever captured, leaving the summary blank and
      #     skipping the Lint-posture step entirely, in exactly the run that
      #     matters most. pr-review.yml:378-384 documents this repo hitting the
      #     identical bug once already ("the canary step already guarded its
      #     claude call, this sibling didn't"), and its fix was also `set +e`.
      #
      #   ${PIPESTATUS[0]} — never `$?`, which after a pipe reads tee's status
      #     (always 0). Without it a real FAIL reports advisory_exit=0 directly
      #     above a table showing FAIL:1. Correct under both this pinned shell
      #     and the repo default (`bash -e`, no pipefail), so it cannot rot if
      #     the `shell:` key changes.
      #
      # Removing either one silently breaks reporting only on FAIL — the case
      # this job exists to surface — which is why both carry a reason here.
      - name: Run doctor
        id: doctor
        working-directory: /tmp/ws
        shell: bash
        run: |
          set +e
          /tmp/cogos doctor | tee /tmp/doctor.txt
          echo "advisory_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # The gate posture is exercised but NOT enforced, so we learn what it
      # would have done long before anyone depends on it.
      - name: Lint posture (reported, not enforced)
        working-directory: /tmp/ws
        run: |
          set +e
          /tmp/cogos doctor --lint --severity-min warn >/dev/null 2>&1
          echo "would-fail-at-warn: exit $?"
          /tmp/cogos doctor --lint --severity-min fail >/dev/null 2>&1
          echo "would-fail-at-fail: exit $?"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## cogos doctor — advisory"
            echo
            echo "| verdict | count |"
            echo "|---|---|"
            for v in OK WARN FAIL UNKNOWN; do
              n=$(grep -cE "^[[:space:]]*\[$v\]" /tmp/doctor.txt || true)
              echo "| $v | ${n:-0} |"
            done
            echo
            echo "Advisory exit: \`${{ steps.doctor.outputs.advisory_exit }}\` (0 unless a check FAILs)"
            echo
            echo "<details><summary>Non-OK findings</summary>"
            echo
            echo '```'
            grep -E "^[[:space:]]*\[(WARN|FAIL|UNKNOWN)\]" /tmp/doctor.txt || echo "(none)"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
