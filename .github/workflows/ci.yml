name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o cogos ./cmd/cogos

      - name: Build (with MCP)
        run: go build -tags mcpserver -o cogos-mcp ./cmd/cogos

  # Cross-compile the entire module for Windows. The build job above only
  # builds ./cmd/cogos (the daemon), which already cross-compiled cleanly —
  # but the repo-root package main (cog node init, BEP, local runner) carried
  # unguarded Unix-only syscalls and broke GOOS=windows undetected (#328).
  # This guards the whole module against platform regressions.
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cross-compile for Windows
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # ripgrep is needed by cog_grep_files. Previously this step ran
      # `apt-get update && install -y ripgrep`; the update wedged on mirror
      # refresh during release run 25808237369 (hung 50+ min before being
      # cancelled). Drop the update — the ubuntu-latest image ships with
      # recent enough apt indexes that install works from cache. A 2-minute
      # timeout guards against unexpected future hangs.
      - name: Install ripgrep
        run: timeout 120 sudo apt-get install -y ripgrep

      - name: Unit tests
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11

      # Shell-hardening gate (ledger L15): every tracked scripts/*.sh file
      # must declare `set -euo pipefail` (or `set -eu` for POSIX sh, which
      # has no pipefail) or carry a documented `# no-pipefail: <reason>`
      # opt-out — plus a shellcheck error-severity pass (0 pre-existing
      # findings at error severity, so any hit is a real regression).
      # ubuntu-latest ships shellcheck preinstalled.
      - name: Shell hardening gate
        run: ./scripts/check-shell-hardening.sh scripts

      # Install-guard coverage tripwire: fails if a new site writing the
      # cogos binary into an install path appears without referencing the
      # shared running-daemon guard (scripts/lib/refuse-if-running.sh /
      # .ps1). Grep-based heuristic, not a proof -- see the script's own
      # header for its honest limits. Added alongside the guard's
      # extraction into one shared implementation; see
      # cog://mem/working/2026-07-30-self-review-spike/RETRO-486.md.
      - name: Install guard coverage gate
        run: ./scripts/check-install-guard-coverage.sh

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        run: go build -o cogos ./cmd/cogos

      - name: Run E2E tests
        run: COGOS_BIN=./cogos ./scripts/e2e-test.sh

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CHANGELOG updated
        run: |
          if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q CHANGELOG.md; then
            echo "::warning file=CHANGELOG.md::CHANGELOG.md was not updated in this PR. Please add a changelog entry describing your changes."
          fi
